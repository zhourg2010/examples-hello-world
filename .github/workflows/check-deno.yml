# Deno 服务端的检查:类型、lint、测试。
#
# 为什么要有这个:客户端那条构建流水线红了 14 次都没人发现(它从加进来那天起就因为一个
# YAML 井号跑不起来)。而 Deno 这一侧是**家人真正在用**的链路 —— 订阅拉不到就是全家断网,
# 更不该裸奔。这一轮跑完只要几十秒,基本不占额度。
#
# 只在 .ts 文件或本文件变动时触发;client/ 目录归 build-client.yml 管,这里排除掉。

name: 检查 Deno 服务

on:
  push:
    branches:
      - main
    paths:
      - '**.ts'
      - 'deno.json'
      - '.github/workflows/check-deno.yml'
      - '!client/**'
  pull_request:
    paths:
      - '**.ts'
      - 'deno.json'
      - '.github/workflows/check-deno.yml'
      - '!client/**'
  workflow_dispatch:

concurrency:
  group: check-deno-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # 三步分开写,是为了在 Actions 的步骤列表里一眼看出是哪一关红的,
      # 不用点进日志翻。
      - name: 类型检查
        run: deno check main.ts free/*.ts routes/*.ts

      - name: Lint
        run: deno lint

      # 必须带 -A:free_test.ts 里有个用例会起一个本地 HTTP 服务,
      # 模拟"源返回 HTML 而不是节点文件"这种坏法,没有 --allow-net 跑不起来。
      - name: 测试
        run: deno test -A
